<!DOCTYPE html>
<html>
<head>
    <title>OAuth Debug - NEXAbot</title>
    <style>
        body { background: #111; color: white; font-family: monospace; padding: 20px; }
        button { background: cyan; color: black; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 10px; }
        pre { background: #1a1a1a; padding: 15px; overflow: auto; margin-top: 20px; border-radius: 8px; max-height: 400px; }
        .success { color: #00ff00; }
        .error { color: #ff4444; }
        .info { color: #ffaa00; }
        .box { border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 8px; }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🔐 OAuth Debug Tool</h1>
    
    <div class="box">
        <h3>Current Status:</h3>
        <div id="status">Initializing...</div>
    </div>
    
    <div>
        <button id="githubBtn">🔐 Test GitHub Login</button>
        <button id="googleBtn">🔐 Test Google Login</button>
        <button id="clearBtn">🗑️ Clear Session</button>
        <button id="checkBtn">🔄 Check Session</button>
    </div>
    
    <div class="box">
        <h3>Debug Log:</h3>
        <pre id="log">Initializing...</pre>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://qxgkityhhwgwohehetek.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4Z2tpdHloaHdnd29oZWhldGVrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ4ODg2ODMsImV4cCI6MjA2MDQ2NDY4M30.1sJiBjO_TySmCfuBw5H5kbbVUe4dsLzTI0I1kRXYkaY';
            
            let supabaseClient = null;
            const logDiv = document.getElementById('log');
            const statusDiv = document.getElementById('status');
            
            function log(msg, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                console.log(`[${timestamp}] ${msg}`);
                const colorClass = type === 'error' ? 'error' : (type === 'success' ? 'success' : 'info');
                logDiv.innerHTML += `<div class="${colorClass}">[${timestamp}] ${msg}</div>`;
                logDiv.scrollTop = logDiv.scrollHeight;
            }
            
            function updateStatus(text, isError = false) {
                statusDiv.innerHTML = `<span class="${isError ? 'error' : 'success'}">${text}</span>`;
            }
            
            async function initSupabase() {
                try {
                    log('Creating Supabase client...');
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    log('✅ Supabase client ready');
                    await checkSession();
                } catch (err) {
                    log(`❌ Failed: ${err.message}`, 'error');
                    updateStatus('Init failed', true);
                }
            }
            
            async function checkSession() {
                if (!supabaseClient) {
                    log('Client not ready', 'error');
                    return;
                }
                
                log('Checking session...');
                try {
                    const { data: { session }, error } = await supabaseClient.auth.getSession();
                    
                    if (error) {
                        log(`Error: ${error.message}`, 'error');
                        updateStatus(`Error: ${error.message}`, true);
                        return;
                    }
                    
                    if (session) {
                        log(`✅ Logged in as: ${session.user.email}`, 'success');
                        updateStatus(`Logged in as: ${session.user.email}`);
                        log('Redirecting to /chat...');
                        setTimeout(() => { window.location.href = '/chat'; }, 1500);
                    } else {
                        log('❌ Not logged in', 'error');
                        updateStatus('Not logged in');
                    }
                } catch (err) {
                    log(`Exception: ${err.message}`, 'error');
                }
            }
            
            async function testOAuth(provider) {
                if (!supabaseClient) {
                    log('Client not ready', 'error');
                    return;
                }
                
                log(`Starting ${provider} login...`);
                updateStatus(`Logging in with ${provider}...`);
                
                try {
                    const { error } = await supabaseClient.auth.signInWithOAuth({
                        provider: provider,
                        options: { 
                            redirectTo: window.location.origin + '/oauth-debug.html'
                        }
                    });
                    
                    if (error) {
                        log(`❌ ${provider} error: ${error.message}`, 'error');
                        updateStatus(`Failed: ${error.message}`, true);
                    } else {
                        log(`✅ Redirecting to ${provider}...`, 'success');
                    }
                } catch (err) {
                    log(`❌ Exception: ${err.message}`, 'error');
                }
            }
            
            async function clearSession() {
                if (!supabaseClient) return;
                log('Clearing session...');
                await supabaseClient.auth.signOut();
                localStorage.clear();
                sessionStorage.clear();
                log('✅ Cleared. Reloading...', 'success');
                setTimeout(() => { window.location.reload(); }, 1000);
            }
            
            // Setup buttons
            document.getElementById('githubBtn').onclick = () => testOAuth('github');
            document.getElementById('googleBtn').onclick = () => testOAuth('google');
            document.getElementById('clearBtn').onclick = clearSession;
            document.getElementById('checkBtn').onclick = checkSession;
            
            // Start
            initSupabase();
        })();
    </script>
</body>
</html>
