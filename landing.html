<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXAbot.AI - Your AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
            text-align: center;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #00ffb3, #00cfff, #ff8a00);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #00ffb3, #00cfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        p {
            color: #9ca3af;
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            padding: 16px 24px;
            border-radius: 48px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
        .btn-android {
            background: #3ddc84;
            color: #0a0a0a;
        }
        .btn-web {
            background: linear-gradient(135deg, #00cfff, #ff8a00);
            color: #0a0a0a;
        }
        .btn:hover {
            transform: scale(1.02);
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 32px 0;
        }
        .feature {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
        }
        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .feature-title {
            font-size: 14px;
            font-weight: 600;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #00ffb3;
        }
        .stat-label {
            font-size: 12px;
            color: #6b7280;
        }
        @media (max-width: 500px) {
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🤖</div>
        <h1>NEXAbot.AI</h1>
        <p>Your personal AI workspace – chat, create, detect, edit, and generate videos, images, and data visualizations.</p>

        <div class="features">
            <div class="feature"><div class="feature-icon">💬</div><div class="feature-title">Smart Chat</div></div>
            <div class="feature"><div class="feature-icon">🎬</div><div class="feature-title">AI Video Studio</div></div>
            <div class="feature"><div class="feature-icon">🎨</div><div class="feature-title">Image Generation</div></div>
            <div class="feature"><div class="feature-icon">🧠</div><div class="feature-title">Memory Bank</div></div>
        </div>

        <a href="/download" class="btn btn-android">📱 Download Android App</a>
        <a href="/app" class="btn btn-web">🌐 Continue to Web Chat</a>

        <div class="stats">
            <div><div class="stat-number">35+</div><div class="stat-label">Music Tracks</div></div>
            <div><div class="stat-number">5</div><div class="stat-label">AI Features</div></div>
            <div><div class="stat-number">Free</div><div class="stat-label">No Credit Card</div></div>
        </div>
    </div>
</body>
</html>
